<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTCG 新手訓練家指南</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f4f4f4; }
        header { background: #ffcb05; color: #2a75bb; text-align: center; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        section { background: white; margin: 20px 0; padding: 20px; border-radius: 8px; }
        h2 { border-left: 5px solid #2a75bb; padding-left: 10px; color: #2a75bb; }
        .grid { display: flex; gap: 20px; justify-content: space-around; flex-wrap: wrap; }
        .card { border: 1px solid #ddd; padding: 15px; border-radius: 10px; width: 200px; text-align: center; }
    </style>
</head>
<body>
    <header>
        <h1>PTCG 寶可夢卡牌新手教室</h1>
        <p>成為冠軍的第一步！</p>
    </header>

    <section>
        <h2>1. 獲勝目標</h2>
        <ul>
            <li>拿取全部 6 張 **獎賞卡**。</li>
            <li>擊敗對手場上最後一隻寶可夢。</li>
            <li>對手回合開始時牌庫已無牌可抽。</li>
        </ul>
    </section>

    <section>
        <h2>2. 卡牌種類</h2>
        <div class="grid">
            <div class="card"><h3>寶可夢</h3><p>負責攻擊與防禦</p></div>
            <div class="card"><h3>訓練家</h3><p>戰術支援與抽牌</p></div>
            <div class="card"><h3>能量</h3><p>發動招式的必備燃料</p></div>
        </div>
    </section>

    <section>
        <h2>3. 回合流程</h2>
        <p>1. 抽一張牌 -> 2. 進行動作 (下怪、附能、用物品) -> 3. 宣佈攻擊 (結束回合)</p>
    </section>
    
   
 <!-- 按鈕 -->

<section class="start-area">
  <button class="goPage">試試看</button>
</section>
    
<style>
.goPage {
  background-color: #4CAF50;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

.goPage:hover {
  background-color: #45a049;
}
</style>

<script>
function goPage() {
  window.location.href = "main.html";
}
</script>
 
</body>
</html>
