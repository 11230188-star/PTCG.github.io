<section>
  <h2>4. 開局流程</h2>
  <ol>
    <li>洗牌</li>
    <li>抽 7 張手牌</li>
    <li>
      放置基礎寶可夢：
      <ul>
        <li>1 隻在戰鬥區（Active）</li>
        <li>若沒有基礎寶可夢 → 對手檢查並重新抽卡</li>
        <li>對手多抽 1 張手牌</li>
      </ul>
    </li>
    <li>最多放 5 隻在備戰區（Bench）</li>
    <li>放 6 張獎賞卡（面朝下）</li>
  </ol>
</section>
